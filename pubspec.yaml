name: motus_lab
description: "Motus Lab - Automotive Diagnostic Platform"
publish_to: "none"
version: 1.0.5+6

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management & DI
  flutter_bloc: ^8.1.3
  google_fonts: ^6.1.0
  get_it: ^7.6.0
  equatable: ^2.0.5

  # Database
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.20
  # sqlcipher_flutter_libs: ^0.5.0 # Bypassed on Windows due to OpenSSL dependency. Enable for encrypted Mobile builds.
  # flutter_secure_storage: ^9.0.0 # Bypassed on Windows due to ATL dependency (atlstr.h missing).
  path_provider: ^2.1.5
  shared_preferences: ^2.2.2
  path: ^1.8.3

  # Logic & Hardware
  math_expressions: ^2.4.0
  flutter_blue_plus: ^1.30.0
  logger: ^2.0.0
  file_picker: ^8.0.0
  local_auth: ^2.1.6

  # Phase 12: Cloud Sync (Firebase)
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.4
  cloud_firestore: ^5.6.3
  firebase_storage: ^12.4.3
  google_sign_in: ^6.2.2
  google_sign_in_all_platforms: ^1.2.1
  connectivity_plus: ^6.0.3
  flutter_dotenv: ^5.2.1

  # Phase 3 Expansion
  fl_chart: ^0.66.0
  pdf: ^3.10.8
  printing: ^5.11.1

  # Phase 4 Desktop Power
  flutter_libserialport: ^0.6.0
  flutter_js: ^0.8.1
  sqlite3: ^2.9.4
  window_manager: ^0.3.8

  # Phase 7 Vehicle Integration
  home_widget: ^0.9.0
  flutter_carplay: ^1.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.14.0
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/protocols/
    - assets/data/
    - assets/modules_db.json
    - .env
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Sarabun
      fonts:
        - asset: assets/fonts/Sarabun-Regular.ttf
        - asset: assets/fonts/Sarabun-Bold.ttf
          weight: 700
